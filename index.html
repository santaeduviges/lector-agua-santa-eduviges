    function sanitizeHouses(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter((h) => {
          if (!h) return false;
          const cod = String(h.codigo || '').trim().toLowerCase();
          const nom = String(h.nombre || '').trim().toLowerCase();
          return cod !== 'codigo' && cod !== 'código' && nom !== 'nombre' && cod !== '';
        })
        .map((h, idx) => ({
          ...h,
          id: h.id || `house-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 7)}`
        }));
    }

    function parseCSVLine(line, delimiter) {
      const row = [];
      let inQuotes = false;
      let currentToken = '';

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentToken += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === delimiter && !inQuotes) {
          row.push(currentToken.trim());
          currentToken = '';
        } else {
          currentToken += char;
        }
      }
      row.push(currentToken.trim());
      return row;
    }

    function calculateWaterBill(previousReading, currentReading, pendingBalance = 0, tariff = DEFAULT_TARIFF) {
      if (currentReading === null || currentReading === undefined || isNaN(currentReading) || currentReading < previousReading) {
        return {
          consumptionM3: 0,
          fixedCharge: tariff.fixedCharge,
          consumptionCharge: 0,
          sewerageFee: tariff.sewerageFee,
          pendingBalance: pendingBalance,
          total: tariff.fixedCharge + tariff.sewerageFee + pendingBalance,
          breakdown: []
        };
      }

      const consumptionM3 = currentReading - previousReading;
      let consumptionCharge = 0;
      const breakdown = [];

      breakdown.push({
        concept: `Cargo Básico (hasta ${tariff.baseAllowanceM3} m³)`,
        amount: tariff.fixedCharge
      });

      if (consumptionM3 > tariff.baseAllowanceM3) {
        const excess = consumptionM3 - tariff.baseAllowanceM3;
        const tier1Capacity = tariff.tier1Limit - tariff.baseAllowanceM3;
        const tier1M3 = Math.min(excess, tier1Capacity);
        const tier1Total = tier1M3 * tariff.tier1Rate;
        consumptionCharge += tier1Total;

        breakdown.push({
          concept: `Consumo (${tariff.baseAllowanceM3 + 1}-${tariff.baseAllowanceM3 + tier1M3} m³) @ ${tariff.currency}${tariff.tier1Rate}`,
          amount: tier1Total
        });

        if (excess > tier1Capacity) {
          const tier2M3 = excess - tier1Capacity;
          const tier2Total = tier2M3 * tariff.tier2Rate;
          consumptionCharge += tier2Total;

          breakdown.push({
            concept: `Excedente (> ${tariff.tier1Limit} m³, ${tier2M3} m³) @ ${tariff.currency}${tariff.tier2Rate}`,
            amount: tier2Total
          });
        }
      }

      if (tariff.sewerageFee > 0) {
        breakdown.push({
          concept: 'Mantenimiento de Red',
          amount: tariff.sewerageFee
        });
      }

      if (pendingBalance > 0) {
        breakdown.push({
          concept: 'Saldo Anterior Pendiente',
          amount: pendingBalance
        });
      }

      const subtotal = tariff.fixedCharge + consumptionCharge + tariff.sewerageFee;
      const total = subtotal + pendingBalance;

      return {
        consumptionM3,
        fixedCharge: tariff.fixedCharge,
        consumptionCharge,
        sewerageFee: tariff.sewerageFee,
        pendingBalance,
        total,
        breakdown
      };
    }

    // --- COMPONENTE PRINCIPAL ---

          return sanitizeHouses(INITIAL_HOUSES);
        }

      const [filterStatus, setFilterStatus] = useState('ALL');

      useEffect(() => {

      const notify = (msg) => {
        setToastMessage(msg);

      };

      const tarifasDisponibles = useMemo(() => {
        const list = new Set(houses.map((h) => h.tarifa || 'Residencial'));

      }, [houses]);

      const filteredHouses = useMemo(() => {
        return houses.filter((h) => {
          const matchSearch =
            (h.nombre || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (h.codigo || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (h.medidor || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (h.novedades && h.novedades.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchTarifa = selectedTarifaFilter === 'ALL' || h.tarifa === selectedTarifaFilter;
          const matchStatus = filterStatus === 'ALL' || h.estatus === filterStatus;
          return matchSearch && matchTarifa && matchStatus;
        });
      }, [houses, searchTerm, selectedTarifaFilter, filterStatus]);

      const stats = useMemo(() => {
        const total = houses.length;
        const completed = houses.filter((h) => h.estatus === 'Leído').length;
        const pending = total - completed;
        let totalM3 = 0;
        let totalBilled = 0;

        houses.forEach((h) => {
          if (h.estatus === 'Leído' && h.lecturaActual !== null) {
            const bill = calculateWaterBill(h.lecturaAnterior, h.lecturaActual, h.pendingBalance, tariff);
            totalM3 += bill.consumptionM3;
            totalBilled += (h.costo !== null && h.costo !== undefined ? h.costo : bill.total);
          }
        });

        return { total, completed, pending, totalM3, totalBilled };
      }, [houses, tariff]);

      const handleOpenReading = (house) => {
        setSelectedHouse(house);
        setReadingInput(house.lecturaActual !== null ? house.lecturaActual.toString() : '');
        setNovedadInput(house.novedades || 'Sin novedad');
      };

      const handleSaveReading = (printDirectly = false) => {
        if (!selectedHouse) return;
        const readingValue = parseFloat(readingInput);

        if (isNaN(readingValue)) {
          notify('Por favor ingrese un valor numérico para la Lectura Actual.');
          return;
        }

        if (readingValue < selectedHouse.lecturaAnterior) {
          notify(`Error: Lectura Actual (${readingValue}) no puede ser menor a la Anterior (${selectedHouse.lecturaAnterior}).`);
          return;
        }

        const calculatedBill = calculateWaterBill(selectedHouse.lecturaAnterior, readingValue, selectedHouse.pendingBalance, tariff);
        const consumption = calculatedBill.consumptionM3;

        const updatedHouses = houses.map((h) => {
          if (h.codigo === selectedHouse.codigo) {

              lecturaActual: readingValue,
              consumo: consumption,
              costo: calculatedBill.total,
              novedades: novedadInput || 'Sin novedad',
              readingDate: new Date().toISOString().split('T')[0],
              estatus: 'Leído'

          }
          return h;
        });

        setHouses(updatedHouses);
        setSelectedHouse({
          ...selectedHouse,
          lecturaActual: readingValue,
          consumo: consumption,
          costo: calculatedBill.total,
          novedades: novedadInput || 'Sin novedad',
          readingDate: new Date().toISOString().split('T')[0],
          estatus: 'Leído'

      const handleSendWhatsApp = (house) => {
        if (!house || house.lecturaActual === null) return;
        const bill = calculateWaterBill(house.lecturaAnterior, house.lecturaActual, house.pendingBalance, tariff);
        const finalCosto = house.costo !== null && house.costo !== undefined ? house.costo : bill.total;

        const message = `*${tariff.providerName}*\n` +
          `Estimado(a) *${house.nombre}*,\n` +
          `Detalle de facturación de agua potable:\n\n` +
          `🏷️ *Código:* ${house.codigo}\n` +
          `🔢 *Medidor:* ${house.medidor}\n` +
          `🏷️ *Tarifa:* ${house.tarifa}\n` +
          `📅 *Fecha:* ${house.readingDate || new Date().toISOString().split('T')[0]}\n` +
          `--------------------------\n` +
          `📊 *Lectura Anterior:* ${house.lecturaAnterior} m³\n` +
          `📊 *Lectura Actual:* ${house.lecturaActual} m³\n` +
          `💧 *Consumo:* ${bill.consumptionM3} m³\n` +
          `⚠️ *Novedades:* ${house.novedades || 'Sin novedad'}\n` +
          `--------------------------\n` +
          `💵 *COSTO TOTAL:* ${tariff.currency} ${finalCosto.toFixed(2)}\n\n` +
          `📌 ${tariff.receiptNotes}\n` +
          `Tel. Atención: ${tariff.providerPhone}`;

        window.open(url, '_blank');

      const handleAddNewHouse = (e) => {

          phone: '',
          pendingBalance: 0
        });
        notify(`Usuario ${created.nombre} (${created.codigo}) registrado.`);
      };

      const processRowsMatrix = (matrix) => {
        if (!matrix || matrix.length < 2) {
          setImportError('El archivo debe incluir al menos la fila de títulos y un usuario.');
          setImportParsedPreview([]);
          return;
        }

        let headerRowIdx = -1;
        let idxCodigo = -1;
        let idxNombre = -1;
        let idxMedidor = -1;
        let idxLecturaAnt = -1;
        let idxLecturaAct = -1;
        let idxEstatus = -1;
        let idxNovedades = -1;
        let idxConsumo = -1;
        let idxTarifa = -1;
        let idxCosto = -1;

        for (let r = 0; r < Math.min(matrix.length, 6); r++) {
          const candidateHeaders = matrix[r].map((h) => String(h || '').trim().toLowerCase().replace(/["']/g, ''));
          const findInCandidate = (keywords) => candidateHeaders.findIndex((h) => keywords.some((k) => h.includes(k)));

          const foundCod = findInCandidate(['codigo', 'código', 'id', 'cod']);
          const foundNom = findInCandidate(['nombre', 'cliente', 'usuario', 'titular']);
          const foundMed = findInCandidate(['medidor', 'contador', 'no_medidor', 'serie']);

          if (foundCod !== -1 || foundNom !== -1 || foundMed !== -1) {
            headerRowIdx = r;
            idxCodigo = foundCod;
            idxNombre = foundNom;
            idxMedidor = foundMed;
            idxLecturaAnt = findInCandidate(['lectura anterior', 'lectura_anterior', 'anterior', 'lect_ant']);
            idxLecturaAct = findInCandidate(['lectura actual', 'lectura_actual', 'actual', 'lect_act']);
            idxEstatus = findInCandidate(['estatus', 'estado', 'status']);
            idxNovedades = findInCandidate(['novedades', 'novedad', 'observacion', 'observaciones']);
            idxConsumo = findInCandidate(['consumo', 'm3', 'consumo_m3']);
            idxTarifa = findInCandidate(['tarifa', 'tipo_tarifa', 'categoria']);
            idxCosto = findInCandidate(['costo', 'total', 'monto', 'importe']);
            break;
          }
        }

        if (headerRowIdx === -1) {
          setImportError('No se reconocieron las columnas mínimas: Codigo, Nombre o Medidor.');
          setImportParsedPreview([]);
          return;
        }

        const parsedRecords = [];
        for (let i = headerRowIdx + 1; i < matrix.length; i++) {
          const row = matrix[i];
          if (!row || row.length === 0) continue;

          const hasContent = row.some((cell) => String(cell || '').trim() !== '');
          if (!hasContent) continue;

          const rawCodigo = idxCodigo !== -1 && row[idxCodigo] ? String(row[idxCodigo]).trim() : '';
          const rawNombre = idxNombre !== -1 && row[idxNombre] ? String(row[idxNombre]).trim() : '';
          const rawMedidor = idxMedidor !== -1 && row[idxMedidor] ? String(row[idxMedidor]).trim() : '';

          const lowerCod = rawCodigo.toLowerCase();
          const lowerNom = rawNombre.toLowerCase();
          if (lowerCod === 'codigo' || lowerCod === 'código' || lowerNom === 'nombre' || lowerNom === 'cliente') {
            continue;
          }

          const codigo = rawCodigo || `SE-${String(100 + i)}`;
          const nombre = rawNombre || `Usuario ${i}`;
          const medidor = rawMedidor || `MED-${1000 + i}`;
          const lecturaAnterior = idxLecturaAnt !== -1 ? parseFloat(row[idxLecturaAnt]) || 0 : 0;
          const lecturaActualVal = idxLecturaAct !== -1 && row[idxLecturaAct] !== '' && !isNaN(parseFloat(row[idxLecturaAct]))
            ? parseFloat(row[idxLecturaAct])
            : null;
          const estatus = idxEstatus !== -1 && row[idxEstatus] ? String(row[idxEstatus]).trim() : (lecturaActualVal !== null ? 'Leído' : 'Pendiente');
          const novedades = idxNovedades !== -1 && row[idxNovedades] ? String(row[idxNovedades]).trim() : 'Sin novedad';
          const tarifa = idxTarifa !== -1 && row[idxTarifa] ? String(row[idxTarifa]).trim() : 'Residencial';

          let consumo = idxConsumo !== -1 && row[idxConsumo] !== '' ? parseFloat(row[idxConsumo]) : null;
          let costo = idxCosto !== -1 && row[idxCosto] !== '' ? parseFloat(row[idxCosto]) : null;

          if (lecturaActualVal !== null && consumo === null) {
            consumo = Math.max(0, lecturaActualVal - lecturaAnterior);
          }
          if (lecturaActualVal !== null && costo === null) {
            const calc = calculateWaterBill(lecturaAnterior, lecturaActualVal, 0, tariff);
            costo = calc.total;
          }

          parsedRecords.push({
            id: `imported-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 7)}`,
            codigo,
            nombre,
            medidor,
            lecturaAnterior,
            lecturaActual: lecturaActualVal,
            estatus,
            novedades,
            consumo,
            tarifa,
            costo,
            phone: '+50588888888',
            readingDate: lecturaActualVal !== null ? new Date().toISOString().split('T')[0] : null,
            pendingBalance: 0
          });
        }

        if (parsedRecords.length === 0) {
          setImportError('No se encontraron usuarios válidos en el archivo.');
          setImportParsedPreview([]);
        } else {
          setImportError(null);
          setImportParsedPreview(parsedRecords);
        }
      };

      const parseCSVData = (rawText) => {
        if (!rawText || !rawText.trim()) {
          setImportParsedPreview([]);
          setImportError(null);
          return;
        }

        try {
          const lines = rawText.trim().split(/\r?\n/).filter((l) => l.trim().length > 0);
          if (lines.length < 2) {
            setImportError('El texto debe incluir encabezados y al menos un registro.');
            setImportParsedPreview([]);
            return;
          }

          const firstLine = lines[0];
          let delimiter = ',';
          if (firstLine.includes(';') && (firstLine.split(';').length > firstLine.split(',').length)) {
            delimiter = ';';
          } else if (firstLine.includes('\t') && (firstLine.split('\t').length > firstLine.split(',').length)) {
            delimiter = '\t';
          }

          const matrix = lines.map((l) => parseCSVLine(l, delimiter));
          processRowsMatrix(matrix);
        } catch (err) {
          setImportError('Error procesando CSV: ' + err.message);
          setImportParsedPreview([]);
        }
      };

      const handleFileInputChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const fileName = file.name.toLowerCase();
        const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');

        if (isExcel && window.XLSX) {
          try {
            notify('Leyendo archivo Excel...');
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = new Uint8Array(event.target?.result);
                const workbook = window.XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                if (!rows || rows.length === 0) {
                  setImportError('La hoja de cálculo está vacía.');
                  return;
                }

                processRowsMatrix(rows);
                const previewCsv = rows.slice(0, 10).map((r) => r.join(',')).join('\n');
                setImportText(previewCsv);
                notify(`Excel cargado con éxito (${firstSheetName})`);
              } catch (error) {
                setImportError('No se pudo leer el archivo Excel: ' + error.message);
              }
            };
            reader.readAsArrayBuffer(file);
          } catch (err) {
            setImportError('Error al procesar Excel: ' + err.message);
          }
        } else {
          const reader = new FileReader();
          reader.onload = (event) => {
            const content = event.target?.result;
            if (typeof content === 'string') {
              setImportText(content);
              parseCSVData(content);
            }
          };
          reader.readAsText(file);
        }
      };

      const handleApplyImport = () => {
        if (importParsedPreview.length === 0) {
          notify('No hay registros válidos para importar.');
          return;
        }

        if (importMode === 'replace') {
          setHouses(sanitizeHouses(importParsedPreview));
          notify(`Padrón reemplazado con ${importParsedPreview.length} usuarios.`);
        } else {
          setHouses((prev) => sanitizeHouses([...prev, ...importParsedPreview]));
          notify(`Se agregaron ${importParsedPreview.length} usuarios a la ruta.`);
        }

        setShowImportModal(false);
        setImportText('');
        setImportParsedPreview([]);
        setImportError(null);
      };

      const downloadSampleTemplate = () => {
        const rows = [
          ["Codigo", "Nombre", "Medidor", "Lectura Anterior", "Lectura Actual", "Estatus", "Novedades", "Consumo", "TARIFA", "COSTO"],
          ["SE-001", "María Eugenia Flores", "MED-8901", 412, "", "Pendiente", "Sin novedad", "", "Residencial", ""],
          ["SE-002", "Carlos Alberto Morales", "MED-8902", 580, 598, "Leído", "Sin novedad", 18, "Residencial", 211.00],
          ["SE-003", "Doña Rosa Pastora", "MED-8903", 215, "", "Pendiente", "Sin novedad", "", "Social", ""],
          ["SE-004", "Juan José Gutiérrez", "MED-8904", 890, "", "Pendiente", "Posible fuga interna", "", "Comercial", ""]
        ];

        if (window.XLSX) {
          const ws = window.XLSX.utils.aoa_to_sheet(rows);
          ws['!cols'] = [
            { wch: 10 }, { wch: 26 }, { wch: 12 }, { wch: 16 },
            { wch: 16 }, { wch: 12 }, { wch: 22 }, { wch: 10 },

          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, ws, "PadronMedidores");
          window.XLSX.writeFile(wb, "plantilla_santa_eduviges.xlsx");
          notify('Plantilla Excel (.xlsx) descargada.');
        } else {
          const csvContent = rows.map((r) => r.join(',')).join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'plantilla_santa_eduviges.csv';
          link.click();
        }
      };

      const handleExportCurrentRoute = () => {

        houses.forEach((h) => {

          link.click();
          notify('Archivo CSV exportado.');
        }
      };

                <div>

              <div className="flex items-center gap-2">
                <button

                >
                  <FileSpreadsheet className="w-4 h-4 text-emerald-300" />

                <button

                <button

                      <div><strong>NOMBRE:</strong> {selectedHouse.nombre}</div>
                      <div><strong>MEDIDOR:</strong> {selectedHouse.medidor}</div>
                      <div><strong>TARIFA:</strong> {selectedHouse.tarifa}</div>
                      <div><strong>ESTATUS:</strong> {selectedHouse.estatus}</div>
                      {selectedHouse.novedades && selectedHouse.novedades !== 'Sin novedad' && (
                        <div className="text-[10px] text-red-700"><strong>NOVEDAD:</strong> {selectedHouse.novedades}</div>
                      )}
                    </div>

                    <div className="py-2 border-b border-dashed border-black space-y-0.5">
                      <div className="flex justify-between">
                        <span>Lectura Actual:</span>
                        <strong>{selectedHouse.lecturaActual || readingInput} m³</strong>
                      </div>
                      <div className="flex justify-between">
                        <span>Lectura Anterior:</span>
                        <span>{selectedHouse.lecturaAnterior} m³</span>
                      </div>
                      <div className="flex justify-between font-bold text-xs pt-1 border-t border-dotted border-black">
                        <span>CONSUMO:</span>
                        <span>{activeBill ? activeBill.consumptionM3 : 0} m³</span>
                      </div>
                    </div>

                    <div className="py-2 border-b border-dashed border-black space-y-1">
                      {activeBill?.breakdown.map((item, i) => (
                        <div key={i} className="flex justify-between">
                          <span className="text-[10px]">{item.concept}</span>
                          <span>{tariff.currency}{item.amount.toFixed(2)}</span>
                        </div>
                      ))}
                    </div>

                    <div className="py-2 text-center border-b border-dashed border-black">
                      <div className="text-[11px] font-bold">COSTO TOTAL A PAGAR</div>
                      <div className="text-lg font-black">
                        {tariff.currency} {activeBill ? activeBill.total.toFixed(2) : '0.00'}
                      </div>
                    </div>

                    <div className="pt-2 text-center text-[9px] space-y-1">
                      <div>*** {tariff.receiptNotes} ***</div>
                      <div>¡Cuidar el agua es cuidar la vida!</div>
                      <div className="pt-2 font-mono text-[8px] text-slate-500">
                        COMPROBANTE EMITIDO EN SITIO
                      </div>
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-white border-t border-slate-100 flex flex-col gap-2">
                  <button
                    onClick={handlePrint}
                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-md transition"
                  >
                    <Printer className="w-4 h-4" />
                    Imprimir en Impresora Térmica
                  </button>

                  <button
                    onClick={() => handleSendWhatsApp(selectedHouse)}
                    className="w-full py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold rounded-xl text-xs flex items-center justify-center gap-2 transition"
                  >
                    <Send className="w-4 h-4" />
                    Enviar copia por WhatsApp
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Importar Excel/CSV */}
          {showImportModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-3xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                <div className="bg-slate-900 text-white px-5 py-3.5 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <FileSpreadsheet className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-bold text-sm">Importar Padrón de Medidores (Excel o CSV)</h3>
                  </div>
                  <button
                    onClick={() => setShowImportModal(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-5 overflow-y-auto flex flex-col gap-4">
                  <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
                    <div>
                      <p className="font-semibold text-blue-950">
                        Acepta libros de Excel (.xlsx, .xls) y archivos .csv
                      </p>
                      <p className="text-blue-800 font-mono text-[11px] mt-0.5">
                        Codigo, Nombre, Medidor, Lectura Anterior, Lectura Actual, Estatus, Novedades, Consumo, TARIFA, COSTO
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={downloadSampleTemplate}
                      className="inline-flex items-center gap-1.5 px-3 py-2 bg-white text-blue-700 hover:bg-blue-100 border border-blue-300 font-bold rounded-xl shadow-sm transition flex-shrink-0"
                    >
                      <Download className="w-3.5 h-3.5" />
                      Descargar Plantilla Excel
                    </button>
                  </div>

                  <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-2xl p-4 text-center bg-slate-50 transition cursor-pointer relative">
                    <input
                      type="file"
                      accept=".xlsx,.xls,.csv,.txt"
                      onChange={handleFileInputChange}
                      className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                    />
                    <Upload className="w-8 h-8 text-blue-500 mx-auto mb-1" />
                    <p className="text-xs font-bold text-slate-700">Toca para seleccionar tu archivo Excel o CSV</p>
                    <p className="text-[11px] text-slate-500">o arrástralo directamente a esta ventana</p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      O pega aquí datos copiados de Excel:
                    </label>
                    <textarea
                      rows={3}
                      value={importText}
                      onChange={(e) => {
                        setImportText(e.target.value);
                        parseCSVData(e.target.value);
                      }}
                      placeholder="Codigo,Nombre,Medidor,Lectura Anterior,Lectura Actual,Estatus,Novedades,Consumo,TARIFA,COSTO&#10;SE-001,María Flores,MED-8901,412,,Pendiente,Sin novedad,,Residencial,"
                      className="w-full p-3 font-mono text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
                    />
                  </div>

                  {importError && (
                    <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl flex items-center gap-2 text-xs text-rose-700 font-medium">
                      <AlertTriangle className="w-4 h-4 flex-shrink-0" />
                      <span>{importError}</span>
                    </div>
                  )}

                  {importParsedPreview.length > 0 && (
                    <div className="flex flex-col gap-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                          <CheckCircle2 className="w-4 h-4 text-emerald-600" />
                          {importParsedPreview.length} usuarios listos para importar
                        </span>

                        <div className="flex items-center gap-2 text-xs">
                          <label className="flex items-center gap-1.5 cursor-pointer">
                            <input
                              type="radio"
                              name="importMode"
                              value="append"
                              checked={importMode === 'append'}
                              onChange={() => setImportMode('append')}
                              className="text-blue-600 focus:ring-blue-500"
                            />
                            <span className="text-slate-600">Sumar a la lista</span>
                          </label>
                          <label className="flex items-center gap-1.5 cursor-pointer">
                            <input
                              type="radio"
                              name="importMode"
                              value="replace"
                              checked={importMode === 'replace'}
                              onChange={() => setImportMode('replace')}
                              className="text-blue-600 focus:ring-blue-500"
                            />
                            <span className="text-rose-600 font-semibold">Reemplazar padrón</span>
                          </label>
                        </div>
                      </div>

                      <div className="max-h-36 overflow-y-auto border border-slate-200 rounded-xl">
                        <table className="w-full text-left text-[11px] whitespace-nowrap">
                          <thead className="bg-slate-100 text-slate-600 sticky top-0">
                            <tr>
                              <th className="p-2">Codigo</th>
                              <th className="p-2">Nombre</th>
                              <th className="p-2">Medidor</th>
                              <th className="p-2 font-mono">Lect. Ant.</th>
                              <th className="p-2 font-mono">Lect. Act.</th>
                              <th className="p-2">Tarifa</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                            {importParsedPreview.slice(0, 10).map((item, idx) => (
                              <tr key={idx} className="hover:bg-slate-50">
                                <td className="p-2 font-mono font-bold text-slate-900">{item.codigo}</td>
                                <td className="p-2">{item.nombre}</td>
                                <td className="p-2 font-mono">{item.medidor}</td>
                                <td className="p-2 font-mono">{item.lecturaAnterior}</td>
                                <td className="p-2 font-mono">{item.lecturaActual ?? '-'}</td>
                                <td className="p-2">{item.tarifa}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                  <button
                    type="button"
                    onClick={handleExportCurrentRoute}
                    className="text-xs font-semibold text-slate-600 hover:text-slate-800 flex items-center gap-1"
                  >
                    <Download className="w-3.5 h-3.5" />
                    Exportar lista actual
                  </button>

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowImportModal(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={handleApplyImport}
                      disabled={importParsedPreview.length === 0}
                      className="px-5 py-2 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl shadow-md transition flex items-center gap-1.5"
                    >
                      <Check className="w-4 h-4" />
                      Confirmar e Importar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Registrar Nuevo Usuario */}
          {showNewHouseModal && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl p-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <Plus className="w-5 h-5 text-blue-600" />
                    <h3 className="font-bold text-slate-900 text-base">Registrar Nuevo Usuario</h3>
                  </div>
                  <button
                    onClick={() => setShowNewHouseModal(false)}
                    className="text-slate-400 hover:text-slate-600"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleAddNewHouse} className="mt-4 flex flex-col gap-3">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Codigo</label>
                      <input
                        type="text"
                        placeholder="Ej: SE-006"
                        value={newHouse.codigo}
                        onChange={(e) => setNewHouse({ ...newHouse, codigo: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Medidor *</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: MED-8906"
                        value={newHouse.medidor}
                        onChange={(e) => setNewHouse({ ...newHouse, medidor: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nombre Completo *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Mario Gómez Morales"
                      value={newHouse.nombre}
                      onChange={(e) => setNewHouse({ ...newHouse, nombre: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">TARIFA</label>
                      <select
                        value={newHouse.tarifa}
                        onChange={(e) => setNewHouse({ ...newHouse, tarifa: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="Residencial">Residencial</option>
                        <option value="Comercial">Comercial</option>
                        <option value="Social">Social</option>
                        <option value="Tarifa Básica">Tarifa Básica</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Lectura Anterior (m³)</label>
                      <input
                        type="number"
                        value={newHouse.lecturaAnterior}
                        onChange={(e) => setNewHouse({ ...newHouse, lecturaAnterior: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Novedades Iniciales</label>
                    <input
                      type="text"
                      placeholder="Sin novedad"
                      value={newHouse.novedades}
                      onChange={(e) => setNewHouse({ ...newHouse, novedades: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div className="mt-3 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowNewHouseModal(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm"
                    >
                      Agregar a la Lista
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
